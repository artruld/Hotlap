<style>
/* Layout: night-circuit canvas wallpaper fixed behind a single column of smoked-glass panels; timing-screen colours carry meaning */
:root{
  --bg:#06070a; --panel:rgba(14,17,23,.78); --panel-solid:#0f1218; --line:rgba(150,165,190,.16);
  --fg:#eef1f5; --muted:#8e98a8; --kerb:#e3322b; --kerb-w:#f4f4f2;
  --purple:#b46cff; --green:#2fd27a; --amber:#ffb21e;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0}
[hidden]{display:none!important}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;min-height:100%}
#wall,#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:880px;margin:0 auto;padding-block:20px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
header.hero{display:flex;flex-direction:column;gap:6px;padding-top:8px}
.kerb{height:8px;width:132px;background:repeating-linear-gradient(90deg,var(--kerb) 0 22px,var(--kerb-w) 22px 44px);transform:skewX(-24deg);border-radius:1px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,8vw,58px);line-height:.95;letter-spacing:.01em;margin:6px 0 0;text-transform:uppercase;font-style:italic;text-wrap:balance}
.hero h1 span{color:var(--kerb)}
.hero p{margin:0;color:var(--muted);font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:5px;background:rgba(8,10,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
nav.tabs button{flex:1 0 auto;font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.03em;color:var(--muted);background:none;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--fg);color:#07080b}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h2{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:.02em;text-transform:uppercase;font-style:italic}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.eyebrow{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.banner{border:1px dashed rgba(255,178,30,.55);background:rgba(255,178,30,.08);color:#ffd88a;border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--amber)}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:420px}
th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.mono{font-family:var(--f-mono);font-weight:500;font-size:14px}
.pos{font-family:var(--f-display);font-weight:700;font-size:18px;font-style:italic;width:34px}
.p1 .pos{color:var(--amber)}
.name{font-weight:600}
.pts{font-family:var(--f-display);font-weight:700;font-size:18px}
.dim{color:var(--muted)}
.t-purple{color:var(--purple)} .t-green{color:var(--green)}
.chip{display:inline-block;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.06em;padding:1px 7px;border-radius:5px;vertical-align:1px;margin-left:5px}
.chip.pb{background:rgba(47,210,122,.16);color:var(--green)}
.chip.fast{background:rgba(180,108,255,.18);color:var(--purple)}
.chip.imp{background:rgba(255,178,30,.16);color:var(--amber)}
.cups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);background:none;border:0;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--fg)}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1 1 140px;min-width:0}
input,select{font:inherit;font-size:15px;color:var(--fg);background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:9px;padding:10px 11px;width:100%;min-width:0}
input.mono{font-family:var(--f-mono)}
.btn{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:9px;padding:11px 18px;cursor:pointer;background:var(--kerb);color:#fff;flex:0 0 auto}
.btn.ghost{background:rgba(255,255,255,.08);color:var(--fg)}
.btn.small{font-size:12px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}
.x:hover{color:var(--kerb)}
.x.confirm{color:#fff;background:var(--kerb)}
.events{display:flex;flex-direction:column;gap:8px}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:rgba(0,0,0,.25);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.ev:hover{border-color:rgba(255,255,255,.3)}
.ev .rd{font-family:var(--f-display);font-weight:700;font-style:italic;font-size:22px;color:var(--kerb);min-width:40px}
.ev .tr{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ev .meta{color:var(--muted);font-size:13px}
.ev .win{text-align:right;font-size:13px;color:var(--muted)}
.ev .win b{color:var(--fg);display:block;font-weight:600}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:10px}
.grid-players{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .pn{font-family:var(--f-display);font-weight:700;font-size:20px;font-style:italic;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hcp{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--amber)}
.hcp small{font-size:11px;color:var(--muted);font-family:var(--f-display);display:block;text-align:right;letter-spacing:.1em}
.stats{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.stats b{display:block;color:var(--fg);font-family:var(--f-mono);font-size:14px}
svg.spark{width:100%;height:46px;display:block}
.laps{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.lap{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:3px 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:12px}
.rules{display:flex;flex-direction:column;gap:14px;font-size:14.5px;max-width:66ch}
.rules h3{font-family:var(--f-display);font-size:15px;margin:0 0 2px;text-transform:uppercase;letter-spacing:.06em}
.rules p,.rules ul{margin:0;color:#cfd5de}
.rules ul{padding-left:18px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.msg{font-size:13px;min-height:1.2em;color:var(--muted)}
.msg.err{color:#ff7b74}
.msg.ok{color:var(--green)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>

<canvas id="wall" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="hero">
    <div class="kerb"></div>
    <h1>Hotlap <span>League</span></h1>
    <p>Assetto Corsa EVO · ลีกจับเวลาของแก๊ง · แต้มต่อ 70% · เพดาน 8%</p>
  </header>

  <div id="demoBanner" class="banner" hidden>
    <span><b>ข้อมูลตัวอย่าง</b> · ยังไม่มีข้อมูลจริงในลีก ไปที่แท็บ "นักแข่ง" เพิ่มชื่อเพื่อนคนแรก แล้วตัวอย่างจะหายไปเอง</span>
  </div>
  <div id="offline" class="banner" hidden><span id="offlineMsg">เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบค่า Firebase ใน index.html และกฎของ Firestore</span></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="standings" aria-selected="true">ตารางคะแนน</button>
    <button role="tab" data-tab="nights" aria-selected="false">คืนแข่ง</button>
    <button role="tab" data-tab="players" aria-selected="false">นักแข่ง</button>
    <button role="tab" data-tab="rules" aria-selected="false">กติกา</button>
  </nav>

  <main id="view"></main>
</div>

<script>
/* ====== วางค่า Firebase ของคุณตรงนี้ (Project settings → Your apps → Config) ====== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAovjafpxeBCBRTCU_zJdcl-WlnZMMtPN0",
  authDomain: "hotlap-league.firebaseapp.com",
  projectId: "hotlap-league",
  storageBucket: "hotlap-league.firebasestorage.app",
  messagingSenderId: "76493124927",
  appId: "1:76493124927:web:d435bf2bebd9c59517cf8a"
};
</script>
<script>
/* ---------- constants ---------- */
const FACTOR=0.7, CAP=8, WARMUP=3, WINDOW=5, MIN_HIST=2;
const POINTS=[10,7,5,3,1];
const TRACKS=["Imola","Monza","Brands Hatch","Laguna Seca","Mount Panorama","Suzuka","Nürburgring GP","Red Bull Ring"];

/* ---------- state ---------- */
const S={players:[],events:[],laps:[],loaded:{p:false,e:false,l:false},db:null,demo:false,tab:"standings",openEvent:null,cup:"hcp"};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(ms){if(ms==null||!isFinite(ms))return"–";const m=Math.floor(ms/60000),s=(ms%60000)/1000;return m+":"+s.toFixed(3).padStart(6,"0")}
function parseTime(str){
  str=String(str).trim().replace(/,/g,".");
  let m=str.match(/^(\d{1,2})[:.](\d{1,2})[.:](\d{1,3})$/);
  if(m)return (+m[1])*60000+(+m[2])*1000+ +(m[3].padEnd(3,"0"));
  m=str.match(/^(\d{1,3})(?:\.(\d{1,3}))?$/);
  if(m)return (+m[1])*1000+(m[2]?+(m[2].padEnd(3,"0")):0);
  return null;
}
const pct=v=>(v>=0?"+":"")+v.toFixed(2)+"%";
const thDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}catch(e){return d}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

/* ---------- demo data (in memory only) ---------- */
function demoData(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=[["d1","ต้น (ตัวอย่าง)",0],["d2","บอส (ตัวอย่าง)",1.6],["d3","เจ (ตัวอย่าง)",3.1],["d4","มิว (ตัวอย่าง)",4.4],["d5","ปอ (ตัวอย่าง)",6.2]];
  const E=[["e1","2026-09-04","Imola","Toyota GR86",104200],["e2","2026-09-11","Brands Hatch","Toyota GR86",87300],["e3","2026-09-18","Monza","BMW M2",112600],["e4","2026-09-25","Laguna Seca","BMW M2",95800],["e5","2026-10-02","Mount Panorama","Toyota GR86",141900],["e6","2026-10-09","Imola","Toyota GR86",104200]];
  const players=P.map(p=>({id:p[0],name:p[1]})),events=E.map((e,i)=>({id:e[0],date:e[1],track:e[2],car:e[3],createdAt:i})),laps=[];
  E.forEach((e,i)=>P.forEach((p,j)=>{if(i===3&&j===4)return;const learn=j>2?i*0.35:i*0.1;const g=Math.max(0,p[2]-learn+(rnd()-.5)*1.6);laps.push({id:"l"+i+j,eventId:e[0],playerId:p[0],ms:Math.round(e[4]*(1+g/100)+rnd()*120)})}));
  return{players,events,laps};
}

/* ---------- league engine ---------- */
function data(){return S.demo?demoData():{players:S.players,events:S.events,laps:S.laps}}
function hcpFrom(hist,scoredIndex){
  if(scoredIndex<WARMUP||hist.length<MIN_HIST)return 0;
  return Math.min(CAP,avg(hist.slice(-WINDOW))*FACTOR);
}
function compute(){
  const {players,events,laps}=data();
  const pmap=Object.fromEntries(players.map(p=>[p.id,p]));
  const evs=[...events].sort((a,b)=>(a.date>b.date?1:a.date<b.date?-1:(a.createdAt||0)-(b.createdAt||0)));
  const hist={},comboBest={},results={};let scored=0;
  const season={};players.forEach(p=>season[p.id]={hcp:[],raw:[],wins:0,nights:0,best:{}});
  evs.forEach((ev,idx)=>{
    ev.round=idx+1;
    const best={};
    laps.forEach(l=>{if(l.eventId===ev.id&&pmap[l.playerId]&&(best[l.playerId]==null||l.ms<best[l.playerId]))best[l.playerId]=l.ms});
    const ids=Object.keys(best);
    if(!ids.length){results[ev.id]={rows:[],scored:false};return}
    const fast=Math.min(...ids.map(i=>best[i]));
    const combo=ev.track+"|"+ev.car;
    let rows=ids.map(pid=>{
      const h=hist[pid]||[];const gap=(best[pid]-fast)/fast*100;
      const hc=hcpFrom(h,scored);
      const prev=(comboBest[combo]||{})[pid];
      return{pid,name:pmap[pid].name,ms:best[pid],gap,hc,adj:best[pid]*(1-hc/100),pb:prev!=null&&best[pid]<prev,firstOnCombo:prev==null,fastest:best[pid]===fast,improve:h.length?avg(h.slice(-WINDOW))-gap:null,bonus:0}
    });
    // raw cup
    [...rows].sort((a,b)=>a.ms-b.ms).forEach((r,i)=>{r.rawPos=i+1;r.rawPts=POINTS[i]||0});
    [...rows].sort((a,b)=>a.adj-b.adj).forEach((r,i)=>{r.hcpPos=i+1;r.hcpPts=POINTS[i]||0});
    rows.forEach(r=>{if(r.pb)r.bonus++});
    const imp=rows.filter(r=>r.improve!=null&&r.improve>0).sort((a,b)=>b.improve-a.improve)[0];
    if(imp){imp.mostImproved=true;imp.bonus++}
    rows.forEach(r=>{
      const s=season[r.pid];s.nights++;if(r.hcpPos===1)s.wins++;
      (hist[r.pid]=hist[r.pid]||[]).push(r.gap);
      comboBest[combo]=comboBest[combo]||{};if(comboBest[combo][r.pid]==null||r.ms<comboBest[combo][r.pid])comboBest[combo][r.pid]=r.ms;
      if(s.best[combo]==null||r.ms<s.best[combo].ms)s.best[combo]={ms:r.ms,track:ev.track,car:ev.car};
    });
    rows.sort((a,b)=>a.hcpPos-b.hcpPos);
    results[ev.id]={rows,scored:true,fast,scoredIndex:scored};
    scored++;
  });
  // per event points incl. zeros for absences
  const scoredEvs=evs.filter(e=>results[e.id].scored);
  const table=players.map(p=>{
    const per=scoredEvs.map(e=>{const r=results[e.id].rows.find(x=>x.pid===p.id);return r?{h:r.hcpPts+r.bonus,r:r.rawPts}:{h:0,r:0}});
    const sum=k=>per.reduce((a,x)=>a+x[k],0);
    const drop=k=>scoredEvs.length>=4&&per.length?Math.min(...per.map(x=>x[k])):0;
    const h=hist[p.id]||[];
    return{pid:p.id,name:p.name,hcpTotal:sum("h")-drop("h"),rawTotal:sum("r")-drop("r"),hcpDrop:drop("h"),rawDrop:drop("r"),
      nights:season[p.id].nights,wins:season[p.id].wins,nextHcp:hcpFrom(h,scored),hist:h,best:season[p.id].best,avgGap:h.length?avg(h.slice(-WINDOW)):null};
  });
  return{evs,results,table,scored,pmap};
}

/* ---------- rendering ---------- */
function render(){
  const ready=S.loaded.p&&S.loaded.e&&S.loaded.l;
  S.demo=ready?!(S.players.length||S.events.length||S.laps.length):S.demo;
  $("#demoBanner").hidden=!S.demo;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const C=compute();
  const v=$("#view");
  if(S.tab==="standings")v.innerHTML=viewStandings(C);
  else if(S.tab==="nights")v.innerHTML=S.openEvent&&C.evs.find(e=>e.id===S.openEvent)?viewEvent(C,S.openEvent):viewNights(C);
  else if(S.tab==="players")v.innerHTML=viewPlayers(C);
  else v.innerHTML=viewRules();
}

function cupTable(C,key,title,sub){
  const rows=[...C.table].sort((a,b)=>b[key+"Total"]-a[key+"Total"]||a.name.localeCompare(b.name));
  if(!rows.length)return`<section class="panel"><h2>${title}</h2><p class="empty">ยังไม่มีนักแข่ง</p></section>`;
  return`<section class="panel"><div class="eyebrow">${key==="hcp"?"ถ้วยหลัก":"เวลาดิบ"}</div><h2>${title}</h2><p class="sub">${sub}</p>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>นักแข่ง</th><th class="num">${key==="hcp"?"HCP ถัดไป":"Gap เฉลี่ย"}</th><th class="num">คืน</th><th class="num">คะแนน</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="${i===0&&r[key+"Total"]>0?"p1":""}"><td class="pos">${i+1}</td><td class="name">${esc(r.name)}</td>
   <td class="num mono ${key==="hcp"?"":"dim"}">${key==="hcp"?(r.nextHcp?r.nextHcp.toFixed(2)+"%":"–"):(r.avgGap!=null?pct(r.avgGap):"–")}</td>
   <td class="num dim">${r.nights}</td><td class="num pts">${r[key+"Total"]}</td></tr>`).join("")}
  </tbody></table></div></section>`;
}
function viewStandings(C){
  const dropNote=C.scored>=4?"ทิ้งคืนที่แย่ที่สุดแล้ว 1 คืน":`ทิ้งคืนแย่สุดเมื่อแข่งครบ 4 คืน (ตอนนี้ ${C.scored})`;
  return`<div class="cups">${cupTable(C,"hcp","ถ้วยแต้มต่อ",`รวมคะแนนหลังหักแต้มต่อ + โบนัส · ${dropNote}`)}${cupTable(C,"raw","ถ้วยความเร็วจริง",`ใครเร็วสุดของจริง ไม่มีแต้มต่อ · ${dropNote}`)}</div>`;
}

function viewNights(C){

function spark(h){
  if(h.length<2)return'<div class="dim" style="font-size:12px;height:46px;display:flex;align-items:center">กราฟขึ้นเมื่อแข่งครบ 2 คืน</div>';
  const W=240,H=46,pad=5,mx=Math.max(...h,1),n=h.length;
  const pts=h.map((v,i)=>[pad+i*(W-2*pad)/(n-1),pad+(v/mx)*(H-2*pad)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[n-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gap จากคนเร็วสุดแต่ละคืน"><line x1="0" x2="${W}" y1="${pad}" y2="${pad}" stroke="var(--purple)" stroke-opacity=".35" stroke-dasharray="3 4"/><path d="${d} L${last[0]} ${H} L${pts[0][0]} ${H}Z" fill="var(--amber)" fill-opacity=".1"/><path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--amber)"/></svg>`;
}

let armed=null;

function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=()=>no(new Error("โหลดไม่ได้: "+src));document.head.appendChild(el)})}
async function loadFirebase(){
  const V="10.12.2";
  const sources=[
    ["https://www.gstatic.com/firebasejs/"+V+"/firebase-app-compat.js","https://www.gstatic.com/firebasejs/"+V+"/firebase-firestore-compat.js"],
    ["https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-app-compat.js","https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-firestore-compat.js"]
  ];
  let last;
  for(const [app,fs] of sources){
    try{if(!window.firebase)await loadScript(app);if(!window.firebase||!firebase.firestore)await loadScript(fs);if(window.firebase&&firebase.firestore)return}catch(e){last=e}
  }
  throw last||new Error("โหลด Firebase SDK ไม่ได้");
}
function showErr(t){$("#offlineMsg").textContent=t;$("#offline").hidden=false;console.error(t)}
(async function(){
  if(!FIREBASE_CONFIG.projectId||FIREBASE_CONFIG.projectId==="PASTE_HERE"){showErr("ยังไม่ได้ใส่ค่า Firebase ใน index.html ตอนนี้แสดงข้อมูลตัวอย่างอย่างเดียว");return}
  let db;
  try{await loadFirebase()}catch(e){showErr("โหลดตัวเชื่อม Firebase ไม่ได้ ลองปิดตัวบล็อกโฆษณา/โหมดประหยัดข้อมูล แล้วรีเฟรช ("+e.message+")");return}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){showErr("เริ่ม Firebase ไม่สำเร็จ: "+(e.code||"")+" "+e.message);return}
  S.db=db;
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[key]=true;$("#offline").hidden=true;
      if(S.loaded.p&&S.loaded.e&&S.loaded.l)safeRender()},
    err=>showErr("อ่านข้อมูลไม่ได้ ("+(err&&err.code||"error")+") "+(err&&err.code==="permission-denied"?"ตรวจสอบว่ากด Publish กฎของ Firestore แล้ว":(err&&err.message)||"")));
  sub("players","p");sub("events","e");sub("laps","l");
})();

/* ---------- wallpaper: night circuit ---------- */
(function(){
  const wall=$("#wall"),fx=$("#fx"),wc=wall.getContext("2d"),fc=fx.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,dpr,curves=[];
  const bez=(c,t)=>{const u=1-t;return[u*u*u*c[0]+3*u*u*t*c[2]+3*u*t*t*c[4]+t*t*t*c[6],u*u*u*c[1]+3*u*u*t*c[3]+3*u*t*t*c[5]+t*t*t*c[7]]};
  const tan=(c,t)=>{const u=1-t;const x=3*u*u*(c[2]-c[0])+6*u*t*(c[4]-c[2])+3*t*t*(c[6]-c[4]),y=3*u*u*(c[3]-c[1])+6*u*t*(c[5]-c[3])+3*t*t*(c[7]-c[5]);const l=Math.hypot(x,y)||1;return[x/l,y/l]};
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[wall,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr});wc.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0);
    const base=[-0.1*W,0.95*H, 0.35*W,0.55*H, 0.55*W,1.25*H, 1.1*W,0.25*H];
    curves=[-60,-28,0,28,60].map(o=>base.map((v,i)=>i%2?v+o:v));drawWall()}
  function drawWall(){
    const g=wc.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0a0c12");g.addColorStop(.6,"#07080b");g.addColorStop(1,"#040506");wc.fillStyle=g;wc.fillRect(0,0,W,H);
    // asphalt grain
    const n=Math.floor(W*H/38);for(let i=0;i<n;i++){const v=20+Math.random()*30;wc.fillStyle=`rgba(${v},${v+3},${v+8},${Math.random()*.5})`;wc.fillRect(Math.random()*W,Math.random()*H,1,1)}
    // track surface band
    const c=curves[2];wc.lineCap="round";
    wc.strokeStyle="rgba(28,31,38,.85)";wc.lineWidth=170;wc.beginPath();wc.moveTo(c[0],c[1]);wc.bezierCurveTo(c[2],c[3],c[4],c[5],c[6],c[7]);wc.stroke();
    // rubbered racing line
    wc.strokeStyle="rgba(5,6,8,.55)";wc.lineWidth=36;wc.stroke();
    // white edge lines
    [-85,85].forEach(o=>{const e=c.map((v,i)=>i%2?v+o:v);wc.strokeStyle="rgba(230,232,236,.22)";wc.lineWidth=2.5;wc.beginPath();wc.moveTo(e[0],e[1]);wc.bezierCurveTo(e[2],e[3],e[4],e[5],e[6],e[7]);wc.stroke()});
    // kerbs on inside edge
    const k=c.map((v,i)=>i%2?v-96:v);const N=140;
    for(let i=0;i<N;i++){const t0=i/N,t1=(i+1)/N;const a=bez(k,t0),b=bez(k,t1),tg=tan(k,t0),nx=-tg[1]*9,ny=tg[0]*9;
      wc.fillStyle=i%2?"rgba(240,240,236,.55)":"rgba(227,50,43,.7)";wc.beginPath();wc.moveTo(a[0]-nx,a[1]-ny);wc.lineTo(b[0]-nx,b[1]-ny);wc.lineTo(b[0]+nx,b[1]+ny);wc.lineTo(a[0]+nx,a[1]+ny);wc.closePath();wc.fill()}
    // grid lines like a timing overlay
    wc.strokeStyle="rgba(150,165,190,.05)";wc.lineWidth=1;for(let x=0;x<W;x+=48){wc.beginPath();wc.moveTo(x,0);wc.lineTo(x,H);wc.stroke()}
    // vignette
    const v=wc.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.2,W*.5,H*.5,Math.max(W,H)*.8);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.75)");wc.fillStyle=v;wc.fillRect(0,0,W,H);
  }
