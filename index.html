<style>

<script>

const FIREBASE_CONFIG = {

  projectId: "hotlap-league",

<script>
/* ---------- constants ---------- */
const FACTOR=0.7, CAP=8, WARMUP=3, WINDOW=5, MIN_HIST=2;
const POINTS=[10,7,5,3,1];
const TRACKS=["Imola","Monza","Brands Hatch","Laguna Seca","Mount Panorama","Suzuka","Nürburgring GP","Red Bull Ring"];

/* ---------- state ---------- */
const S={players:[],events:[],laps:[],loaded:{p:false,e:false,l:false},db:null,demo:false,tab:"standings",openEvent:null,
  selPid:null,lapDigits:"",editLap:null,editDigits:"",lastC:null};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(ms){if(ms==null||!isFinite(ms))return"–";ms=Math.round(ms);const m=Math.floor(ms/60000),s=(ms%60000)/1000;return m+":"+s.toFixed(3).padStart(6,"0")}
const sec=ms=>(Math.abs(ms)/1000).toFixed(3);
const gapTxt=ms=>(ms<0?"−":"+")+sec(ms);
const hcTxt=ms=>ms?"−"+sec(ms):"–";
const thDate=d=>{try{return new Date(d+"T12:00:00").toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"2-digit"})}catch(e){return d}};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;

/* ---------- time mask: type digits, fills from the right ---------- */
function cleanDigits(v){return String(v).replace(/\D/g,"").replace(/^0+/,"").slice(0,7)}
function splitDigits(d){const x=d.padStart(6,"0");return{mm:+x.slice(0,-5),ss:x.slice(-5,-3),ms:x.slice(-3)}}
function maskFmt(d){if(!d)return"";const p=splitDigits(d);return p.mm+":"+p.ss+"."+p.ms}
function digitsToMs(d){if(!d)return null;const p=splitDigits(d);if(+p.ss>59)return NaN;return p.mm*60000+(+p.ss)*1000+(+p.ms)}
function msToDigits(ms){return cleanDigits(fmt(ms))}

/* ---------- demo data (in memory only) ---------- */
function demoData(){
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const P=[["d1","ต้น (ตัวอย่าง)",0],["d2","บอส (ตัวอย่าง)",1.6],["d3","เจ (ตัวอย่าง)",3.1],["d4","มิว (ตัวอย่าง)",4.4],["d5","ปอ (ตัวอย่าง)",6.2]];
  const E=[["e1","2026-09-04","Imola","Toyota GR86",104200],["e2","2026-09-11","Brands Hatch","Toyota GR86",87300],["e3","2026-09-18","Monza","BMW M2",112600],["e4","2026-09-25","Laguna Seca","BMW M2",95800],["e5","2026-10-02","Mount Panorama","Toyota GR86",141900],["e6","2026-10-09","Imola","Toyota GR86",104200]];
  const players=P.map((p,i)=>({id:p[0],name:p[1],createdAt:i})),events=E.map((e,i)=>({id:e[0],date:e[1],track:e[2],car:e[3],createdAt:i})),laps=[];
  E.forEach((e,i)=>P.forEach((p,j)=>{if(i===3&&j===4)return;if(i===5&&j>2)return;const learn=j>2?i*0.35:i*0.1;const g=Math.max(0,p[2]-learn+(rnd()-.5)*1.6);laps.push({id:"l"+i+j,eventId:e[0],playerId:p[0],ms:Math.round(e[4]*(1+g/100)+rnd()*120)})}));
  return{players,events,laps};
}

/* ---------- league engine ---------- */
function data(){
  const d=S.demo?demoData():{players:S.players,events:S.events,laps:S.laps};
  return{...d,players:[...d.players].sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))};
}
function hcpFrom(hist,scoredIndex){
  if(scoredIndex<WARMUP||hist.length<MIN_HIST)return 0;
  return Math.min(CAP,avg(hist.slice(-WINDOW))*FACTOR);
}
function compute(){
  const {players,events,laps}=data();
  const pmap=Object.fromEntries(players.map(p=>[p.id,p]));
  const evs=[...events].sort((a,b)=>(a.date>b.date?1:a.date<b.date?-1:(a.createdAt||0)-(b.createdAt||0)));
  const hist={},histMs={},comboBest={},results={};let scored=0;
  const season={};players.forEach(p=>season[p.id]={wins:0,races:0,best:{}});
  const records={};
  evs.forEach((ev,idx)=>{
    ev.round=idx+1;
    const hcAll={};players.forEach(p=>hcAll[p.id]=hcpFrom(hist[p.id]||[],scored));
    const best={};
    laps.forEach(l=>{if(l.eventId===ev.id&&pmap[l.playerId]&&(best[l.playerId]==null||l.ms<best[l.playerId]))best[l.playerId]=l.ms});
    const ids=Object.keys(best);
    if(!ids.length){results[ev.id]={rows:[],scored:false,hcAll,scoredIndex:scored};return}
    const fast=Math.min(...ids.map(i=>best[i]));
    const combo=ev.track+"|"+ev.car;
    const rows=ids.map(pid=>{
      const h=hist[pid]||[];const gapMs=best[pid]-fast;const gap=gapMs/fast*100;
      const hc=hcAll[pid];const hcMs=Math.round(fast*hc/100);
      const prev=(comboBest[combo]||{})[pid];
      return{pid,name:pmap[pid].name,ms:best[pid],gap,gapMs,hc,hcMs,adj:best[pid]-hcMs,pb:prev!=null&&best[pid]<prev,fastest:best[pid]===fast,improve:h.length?avg(h.slice(-WINDOW))-gap:null,bonus:0}
    });
    [...rows].sort((a,b)=>a.ms-b.ms).forEach((r,i)=>{r.rawPos=i+1;r.rawPts=POINTS[i]||0});
    [...rows].sort((a,b)=>a.adj-b.adj||a.ms-b.ms).forEach((r,i)=>{r.hcpPos=i+1;r.hcpPts=POINTS[i]||0});
    rows.forEach(r=>{if(r.pb)r.bonus++});
    const imp=rows.filter(r=>r.improve!=null&&r.improve>0).sort((a,b)=>b.improve-a.improve)[0];
    if(imp){imp.mostImproved=true;imp.bonus++}
    rows.forEach(r=>{
      const s=season[r.pid];s.races++;if(r.hcpPos===1)s.wins++;
      (hist[r.pid]=hist[r.pid]||[]).push(r.gap);(histMs[r.pid]=histMs[r.pid]||[]).push(r.gapMs);
      comboBest[combo]=comboBest[combo]||{};if(comboBest[combo][r.pid]==null||r.ms<comboBest[combo][r.pid])comboBest[combo][r.pid]=r.ms;
      if(s.best[combo]==null||r.ms<s.best[combo].ms)s.best[combo]={ms:r.ms,track:ev.track,car:ev.car};
      if(!records[combo]||r.ms<records[combo].ms)records[combo]={ms:r.ms,name:r.name,track:ev.track,car:ev.car,date:ev.date};
    });
    rows.sort((a,b)=>a.hcpPos-b.hcpPos);
    results[ev.id]={rows,scored:true,fast,scoredIndex:scored,hcAll};
    scored++;
  });
  // reference lap for showing HCP in seconds outside a race: latest race's track
  let ref=null,refTrack=null;const last=evs[evs.length-1];
  if(last){
    const same=[...evs].reverse().find(e=>e.track===last.track&&results[e.id].fast);
    const any=[...evs].reverse().find(e=>results[e.id].fast);
    const pick=same||any;if(pick){ref=results[pick.id].fast;refTrack=pick.track}
  }
  const scoredEvs=evs.filter(e=>results[e.id].scored);
  const table=players.map(p=>{
    const per=scoredEvs.map(e=>{const r=results[e.id].rows.find(x=>x.pid===p.id);return r?{h:r.hcpPts+r.bonus,r:r.rawPts}:{h:0,r:0}});
    const sum=k=>per.reduce((a,x)=>a+x[k],0);
    const drop=k=>scoredEvs.length>=4&&per.length?Math.min(...per.map(x=>x[k])):0;
    const h=hist[p.id]||[],hm=histMs[p.id]||[];
    const nextHcp=hcpFrom(h,scored);
    return{pid:p.id,name:p.name,hcpTotal:sum("h")-drop("h"),rawTotal:sum("r")-drop("r"),
      races:season[p.id].races,wins:season[p.id].wins,nextHcp,nextHcpMs:ref?Math.round(ref*nextHcp/100):null,
      hist:hm,best:season[p.id].best,avgGapMs:hm.length?avg(hm.slice(-WINDOW)):null};
  });
  return{evs,results,table,scored,pmap,players,ref,refTrack,records};
}

/* targets: what each driver must beat to lead the handicap cup */
function targetsFor(C,id){
  const R=C.results[id];if(!R.rows.length)return[];
  return C.players.map(p=>{
    const own=R.rows.find(r=>r.pid===p.id);
    const hcMs=Math.round(R.fast*(R.hcAll[p.id]||0)/100);
    const others=R.rows.filter(r=>r.pid!==p.id);
    if(!others.length)return{pid:p.id,name:p.name,own,lead:true,margin:null,hcMs};
    const leaderAdj=Math.min(...others.map(r=>r.adj));
    if(own&&own.adj<leaderAdj)return{pid:p.id,name:p.name,own,lead:true,margin:leaderAdj-own.adj,hcMs};
    const target=leaderAdj+hcMs;
    return{pid:p.id,name:p.name,own,lead:false,target,short:own?own.ms-target:null,hcMs};
  });
}

  $("#demoBanner").hidden=!S.demo;
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const C=compute();S.lastC=C;

  if(S.tab==="standings")v.innerHTML=viewStandings(C);

function updatePreview(){
  const el=$("#lapPrev");if(!el)return;
  const C=S.lastC,R=C&&C.results[S.openEvent];const ms=digitsToMs(S.lapDigits);
  if(ms==null){el.innerHTML="";return}
  if(isNaN(ms)){el.innerHTML='<span class="err">วินาทีต้องไม่เกิน 59</span>';return}
  if(ms<20000){el.innerHTML='<span class="dim">พิมพ์ต่อ…</span>';return}
  const name=(C.pmap[S.selPid]||{}).name||"";
  if(!R||!R.rows.length){el.innerHTML=`<b>${esc(name)}</b> · ${fmt(ms)} · รอบแรกของรายการนี้`;return}
  const own=R.rows.find(r=>r.pid===S.selPid);
  if(own&&ms>=own.ms){el.innerHTML=`<b>${esc(name)}</b> · ${fmt(ms)} <span class="dim">ไม่ดีกว่าเวลาเดิม ${fmt(own.ms)}</span>`;return}
  const fast=Math.min(R.fast,ms);const hcMs=Math.round(fast*(R.hcAll[S.selPid]||0)/100);const adj=ms-hcMs;
  const others=R.rows.filter(r=>r.pid!==S.selPid);
  const pos=1+others.filter(r=>r.adj<adj).length;const rawPos=1+others.filter(r=>r.ms<ms).length;
  el.innerHTML=`<b>${esc(name)}</b> · ${ms<R.fast?'<span class="t-purple">เร็วสุดของรายการ</span>':`Gap ${gapTxt(ms-R.fast)}`} · หลังหัก ${fmt(adj)} → <b class="${pos===1?"t-amber":""}">อันดับ ${pos}</b> <span class="dim">(ดิบ ${rawPos})</span>`;
}

function spark(h){
  if(h.length<2)return'<div class="dim" style="font-size:12px;height:46px;display:flex;align-items:center">กราฟขึ้นเมื่อแข่งครบ 2 รายการ</div>';
  const W=240,H=46,pad=5,mx=Math.max(...h,1),n=h.length;
  const pts=h.map((v,i)=>[pad+i*(W-2*pad)/(n-1),pad+(v/mx)*(H-2*pad)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const last=pts[n-1];
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gap จากคนเร็วสุดแต่ละรายการ"><line x1="0" x2="${W}" y1="${pad}" y2="${pad}" stroke="var(--purple)" stroke-opacity=".35" stroke-dasharray="3 4"/><path d="${d} L${last[0]} ${H} L${pts[0][0]} ${H}Z" fill="var(--amber)" fill-opacity=".1"/><path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--amber)"/></svg>`;
}

/* ---------- result card image ---------- */
async function makeCard(C,id){
  const ev=C.evs.find(e=>e.id===id),R=C.results[id];
  try{await Promise.all(['italic 700 90px "Chakra Petch"','600 40px "IBM Plex Sans Thai"','700 40px "JetBrains Mono"'].map(f=>document.fonts.load(f)))}catch(e){}
  const W=1080,H=Math.max(1080,560+R.rows.length*150),cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,"#0c0f16");bg.addColorStop(1,"#040506");g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();g.globalAlpha=.07;g.strokeStyle="#9fb0d0";for(let x=0;x<W;x+=54){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}g.restore();
  g.save();g.translate(80,90);g.transform(1,0,-.45,1,0,0);for(let i=0;i<8;i++){g.fillStyle=i%2?"#f4f4f2":"#e3322b";g.fillRect(i*40,0,40,14)}g.restore();
  const disp='"Chakra Petch","IBM Plex Sans Thai",sans-serif',body='"IBM Plex Sans Thai",sans-serif',mono='"JetBrains Mono",monospace';
  g.textBaseline="alphabetic";g.font=`italic 700 92px ${disp}`;g.fillStyle="#eef1f5";g.fillText("HOTLAP",80,200);
  const w1=g.measureText("HOTLAP ").width;g.fillStyle="#e3322b";g.fillText("LEAGUE",80+w1,200);
  g.font=`italic 700 46px ${disp}`;g.fillStyle="#e3322b";g.fillText("R"+ev.round,80,290);
  g.fillStyle="#eef1f5";g.font=`600 46px ${body}`;g.fillText(ev.track,80+g.measureText("R"+ev.round+"  ").width+14,290);
  g.fillStyle="#8e98a8";g.font=`500 32px ${body}`;g.fillText(ev.car+" · "+thDate(ev.date),80,340);
  let y=420;
  R.rows.forEach((r,i)=>{
    const top=i<3,h=top?136:112;
    g.fillStyle=i===0?"rgba(255,178,30,.12)":"rgba(255,255,255,.045)";roundRect(g,60,y,W-120,h-16,18);g.fill();
    if(i===0){g.fillStyle="#ffb21e";g.fillRect(60,y,8,h-16)}
    const cy=y+(h-16)/2;
    g.font=`italic 700 ${top?64:50}px ${disp}`;g.fillStyle=i===0?"#ffb21e":"#eef1f5";g.textBaseline="middle";g.fillText(String(r.hcpPos),96,cy+2);
    g.font=`600 ${top?42:36}px ${body}`;g.fillStyle="#eef1f5";g.fillText(r.name,180,cy-20);
    g.font=`700 ${top?32:28}px ${mono}`;g.fillStyle=r.fastest?"#b46cff":r.pb?"#2fd27a":"#aab3c2";
    let tx=`${fmt(r.ms)}`;g.fillText(tx,180,cy+24);
    let cx=180+g.measureText(tx+"  ").width;
    g.font=`600 24px ${disp}`;
    const chips=[];if(r.fastest)chips.push(["FASTEST","#b46cff"]);if(r.pb)chips.push(["PB","#2fd27a"]);if(r.mostImproved)chips.push(["พัฒนาสุด","#ffb21e"]);
    chips.forEach(([t,c])=>{const cw=g.measureText(t).width+24;g.fillStyle=c+"33";roundRect(g,cx,cy+8,cw,34,8);g.fill();g.fillStyle=c;g.fillText(t,cx+12,cy+26);cx+=cw+10});
    g.textAlign="right";g.font=`italic 700 ${top?60:48}px ${disp}`;g.fillStyle="#eef1f5";g.fillText(String(r.hcpPts+r.bonus),W-96,cy-8);
    g.font=`500 22px ${body}`;g.fillStyle="#8e98a8";g.fillText("แต้ม",W-96,cy+34);
    g.font=`700 28px ${mono}`;g.fillStyle="#cfd5de";g.fillText(fmt(r.adj),W-230,cy-14);
    g.font=`500 22px ${body}`;g.fillStyle="#ffb21e";g.fillText(r.hcMs?"HCP "+hcTxt(r.hcMs):"ไม่มี HCP",W-230,cy+26);
    g.textAlign="left";g.textBaseline="alphabetic";
    y+=h;
  });
  const f=R.rows.find(r=>r.fastest);
  y+=40;g.font=`600 30px ${body}`;g.fillStyle="#b46cff";g.fillText(`⚡ เร็วสุดจริง: ${f.name} ${fmt(f.ms)}`,80,y);
  const lead=[...C.table].sort((a,b)=>b.hcpTotal-a.hcpTotal)[0];
  if(lead){y+=50;g.fillStyle="#8e98a8";g.fillText(`🏆 ผู้นำถ้วยแต้มต่อ: ${lead.name} ${lead.hcpTotal} คะแนน`,80,y)}
  return new Promise(ok=>cv.toBlob(b=>ok(b),"image/png"));
}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
let cardUrl=null,cardFile=null;
async function openCard(id){
  const m=$("#modal");m.hidden=false;$("#cardImg").removeAttribute("src");$("#cardMsg").textContent="กำลังสร้างรูป…";
  const ev=S.lastC.evs.find(e=>e.id===id);const blob=await makeCard(S.lastC,id);
  if(cardUrl)URL.revokeObjectURL(cardUrl);cardUrl=URL.createObjectURL(blob);
  const name=`hotlap-R${ev.round}-${ev.track.replace(/\s+/g,"-")}.png`;cardFile=new File([blob],name,{type:"image/png"});
  $("#cardImg").src=cardUrl;const dl=$("#dlBtn");dl.href=cardUrl;dl.download=name;
  $("#shareBtn").hidden=!(navigator.canShare&&navigator.canShare({files:[cardFile]}));
  $("#cardMsg").textContent="กดส่งต่อเพื่อแชร์เข้า LINE หรือกดค้างที่รูปเพื่อบันทึก";
}

/* ---------- actions ---------- */
function msg(id,t,cls){const m=$(id);if(m){m.textContent=t;m.className="msg "+(cls||"")}}
async function guard(fn,id){try{await fn()}catch(e){console.error(e);msg(id,"บันทึกไม่สำเร็จ: "+(e&&e.code==="permission-denied"?"ฐานข้อมูลไม่อนุญาต ตรวจสอบกฎของ Firestore":(e&&e.message)||"ลองใหม่อีกครั้ง"),"err")}}
document.addEventListener("input",e=>{
  const el=e.target;if(!el.classList||!el.classList.contains("tmask"))return;
  const d=cleanDigits(el.value);el.value=maskFmt(d);try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
  if(el.id==="lapT"){S.lapDigits=d;updatePreview()}else if(el.id==="editT")S.editDigits=d;
});
document.addEventListener("submit",async e=>{
  e.preventDefault();if(!S.db)return;
  if(e.target.id==="pForm"){const n=$("#pName").value.trim();if(!n)return;
    if(S.players.some(p=>p.name===n)){msg("#pMsg","มีชื่อนี้แล้ว","err");return}
    await guard(async()=>{await S.db.collection("players").add({name:n,createdAt:Date.now()});$("#pName").value="";msg("#pMsg","เพิ่ม "+n+" แล้ว","ok")},"#pMsg")}
  if(e.target.id==="evForm"){if(S.demo)return;const d=$("#evDate").value,t=$("#evTrack").value.trim(),c=$("#evCar").value.trim();if(!d||!t||!c)return;
    await guard(async()=>{const r=await S.db.collection("events").add({date:d,track:t,car:c,createdAt:Date.now()});S.openEvent=r.id;render()},"#evMsg")}
  if(e.target.id==="lapForm"){if(S.demo)return;const ms=digitsToMs(S.lapDigits),pid=S.selPid;
    if(!pid){msg("#lapMsg","เลือกนักแข่งก่อน","err");return}
    if(ms==null||isNaN(ms)||ms<20000||ms>900000){msg("#lapMsg","เวลาไม่ถูกต้อง พิมพ์ตัวเลขเรียง เช่น 143512 = 1:43.512","err");return}
    const ps=S.lastC.players,i=ps.findIndex(p=>p.id===pid),next=ps[(i+1)%ps.length];const name=(ps[i]||{}).name;
    S.lapDigits="";S.selPid=next.id;render();
    await guard(async()=>{await S.db.collection("laps").add({eventId:S.openEvent,playerId:pid,ms,createdAt:Date.now()});
      msg("#lapMsg",`บันทึก ${fmt(ms)} ให้ ${name} แล้ว · ต่อไป: ${next.name}`,"ok");const t=$("#lapT");if(t)t.focus({preventScroll:true})},"#lapMsg")}
  if(e.target.id==="editForm"){const ms=digitsToMs(S.editDigits);
    if(ms==null||isNaN(ms)||ms<20000||ms>900000){msg("#lapMsg","เวลาที่แก้ไม่ถูกต้อง","err");return}
    const id=S.editLap;S.editLap=null;render();
    await guard(async()=>{await S.db.doc("laps/"+id).update({ms});msg("#lapMsg","แก้เวลาเป็น "+fmt(ms)+" แล้ว","ok")},"#lapMsg")}
});
let armed=null;
document.addEventListener("click",async e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.openEvent=null;S.editLap=null;try{history.replaceState(null,"","#"+S.tab)}catch(_){}render();window.scrollTo({top:0});return}
  if(t.dataset.open){S.openEvent=t.dataset.open;S.lapDigits="";S.editLap=null;render();window.scrollTo({top:0});return}
  if(t.hasAttribute("data-back")){S.openEvent=null;S.editLap=null;render();return}
  if(t.dataset.pick){S.selPid=t.dataset.pick;document.querySelectorAll(".drv").forEach(b=>b.setAttribute("aria-checked",b.dataset.pick===S.selPid));
render();const l=$("#lapT");if(l)l.focus({preventScroll:true});return}
  if(t.dataset.edit){const l=S.laps.find(x=>x.id===t.dataset.edit);if(!l)return;S.editLap=l.id;S.editDigits=msToDigits(l.ms);render();const el=$("#editT");if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}return}
  if(t.hasAttribute("data-canceledit")){S.editLap=null;render();return}
  if(t.dataset.card){openCard(t.dataset.card);return}
  if(t.hasAttribute("data-close")){$("#modal").hidden=true;return}
  if(t.id==="shareBtn"){try{await navigator.share({files:[cardFile],title:"Hotlap League"})}catch(_){}return}
  const delKey=t.dataset.del||t.dataset.delp||t.dataset.delev;
  if(delKey&&S.db){
    if(armed!==t){if(armed&&document.contains(armed)){armed.classList.remove("confirm");armed.textContent=armed.dataset.label}armed=t;t.dataset.label=t.textContent;t.classList.add("confirm");t.textContent="แตะอีกครั้งเพื่อยืนยัน";return}
    armed=null;
    try{
      if(t.dataset.del)await S.db.doc("laps/"+t.dataset.del).delete();
      if(t.dataset.delp){for(const l of S.laps.filter(l=>l.playerId===t.dataset.delp))await S.db.doc("laps/"+l.id).delete();await S.db.doc("players/"+t.dataset.delp).delete()}
      if(t.dataset.delev){const id=t.dataset.delev;for(const l of S.laps.filter(l=>l.eventId===id))await S.db.doc("laps/"+l.id).delete();await S.db.doc("events/"+id).delete();S.openEvent=null;render()}
    }catch(err){t.classList.remove("confirm");t.textContent="ลบไม่สำเร็จ"}
  }
});

function safeRender(){
  const vals={};document.querySelectorAll("#view input,#view select").forEach(el=>{if(el.id&&!el.classList.contains("tmask"))vals[el.id]=el.value});
  const f=document.activeElement&&document.activeElement.id;render();
  Object.entries(vals).forEach(([k,v])=>{const el=document.getElementById(k);if(el&&v!=="")el.value=v});
  if(f&&document.getElementById(f)){const el=document.getElementById(f);el.focus({preventScroll:true});if(el.classList.contains("tmask"))try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}}
}
/* ---------- boot ---------- */
(function(){const h=(location.hash||"").slice(1);if(["standings","races","players","rules"].includes(h))S.tab=h})();
S.demo=true;render();
function loadScript(src){return new Promise((ok,no)=>{const el=document.createElement("script");el.src=src;el.onload=ok;el.onerror=()=>no(new Error("โหลดไม่ได้: "+src));document.head.appendChild(el)})}
async function loadFirebase(){
  const V="10.12.2";
  const sources=[
    ["https://www.gstatic.com/firebasejs/"+V+"/firebase-app-compat.js","https://www.gstatic.com/firebasejs/"+V+"/firebase-firestore-compat.js"],
    ["https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-app-compat.js","https://cdn.jsdelivr.net/npm/firebase@"+V+"/firebase-firestore-compat.js"]
  ];
  let last;
  for(const [app,fs] of sources){
    try{if(!window.firebase)await loadScript(app);if(!window.firebase||!firebase.firestore)await loadScript(fs);if(window.firebase&&firebase.firestore)return}catch(e){last=e}
  }
  throw last||new Error("โหลด Firebase SDK ไม่ได้");
}
function showErr(t){$("#offlineMsg").textContent=t;$("#offline").hidden=false;console.error(t)}
(async function(){
  if(!FIREBASE_CONFIG.projectId||FIREBASE_CONFIG.projectId==="PASTE_HERE"){showErr("ยังไม่ได้ใส่ค่า Firebase ใน index.html ตอนนี้แสดงข้อมูลตัวอย่างอย่างเดียว");return}
  let db;
  try{await loadFirebase()}catch(e){showErr("โหลดตัวเชื่อม Firebase ไม่ได้ ลองปิดตัวบล็อกโฆษณา/โหมดประหยัดข้อมูล แล้วรีเฟรช ("+e.message+")");return}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){showErr("เริ่ม Firebase ไม่สำเร็จ: "+(e.code||"")+" "+e.message);return}
  S.db=db;
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded[key]=true;$("#offline").hidden=true;
      if(S.loaded.p&&S.loaded.e&&S.loaded.l)safeRender()},
    err=>showErr("อ่านข้อมูลไม่ได้ ("+(err&&err.code||"error")+") "+(err&&err.code==="permission-denied"?"ตรวจสอบว่ากด Publish กฎของ Firestore แล้ว":(err&&err.message)||"")));
  sub("players","p");sub("events","e");sub("laps","l");
})();

/* ---------- wallpaper: night circuit ---------- */
(function(){
  const wall=$("#wall"),fx=$("#fx"),wc=wall.getContext("2d"),fc=fx.getContext("2d");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,dpr,curves=[];
  const bez=(c,t)=>{const u=1-t;return[u*u*u*c[0]+3*u*u*t*c[2]+3*u*t*t*c[4]+t*t*t*c[6],u*u*u*c[1]+3*u*u*t*c[3]+3*u*t*t*c[5]+t*t*t*c[7]]};
  const tan=(c,t)=>{const u=1-t;const x=3*u*u*(c[2]-c[0])+6*u*t*(c[4]-c[2])+3*t*t*(c[6]-c[4]),y=3*u*u*(c[3]-c[1])+6*u*t*(c[5]-c[3])+3*t*t*(c[7]-c[5]);const l=Math.hypot(x,y)||1;return[x/l,y/l]};
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;[wall,fx].forEach(c=>{c.width=W*dpr;c.height=H*dpr});wc.setTransform(dpr,0,0,dpr,0,0);fc.setTransform(dpr,0,0,dpr,0,0);
    const base=[-0.1*W,0.95*H, 0.35*W,0.55*H, 0.55*W,1.25*H, 1.1*W,0.25*H];
    curves=[-60,-28,0,28,60].map(o=>base.map((v,i)=>i%2?v+o:v));drawWall()}
  function drawWall(){
    const g=wc.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0a0c12");g.addColorStop(.6,"#07080b");g.addColorStop(1,"#040506");wc.fillStyle=g;wc.fillRect(0,0,W,H);
    // asphalt grain
    const n=Math.floor(W*H/38);for(let i=0;i<n;i++){const v=20+Math.random()*30;wc.fillStyle=`rgba(${v},${v+3},${v+8},${Math.random()*.5})`;wc.fillRect(Math.random()*W,Math.random()*H,1,1)}
    // track surface band
    const c=curves[2];wc.lineCap="round";
    wc.strokeStyle="rgba(28,31,38,.85)";wc.lineWidth=170;wc.beginPath();wc.moveTo(c[0],c[1]);wc.bezierCurveTo(c[2],c[3],c[4],c[5],c[6],c[7]);wc.stroke();
    // rubbered racing line
    wc.strokeStyle="rgba(5,6,8,.55)";wc.lineWidth=36;wc.stroke();
    // white edge lines
    [-85,85].forEach(o=>{const e=c.map((v,i)=>i%2?v+o:v);wc.strokeStyle="rgba(230,232,236,.22)";wc.lineWidth=2.5;wc.beginPath();wc.moveTo(e[0],e[1]);wc.bezierCurveTo(e[2],e[3],e[4],e[5],e[6],e[7]);wc.stroke()});
    // kerbs on inside edge
    const k=c.map((v,i)=>i%2?v-96:v);const N=140;
    for(let i=0;i<N;i++){const t0=i/N,t1=(i+1)/N;const a=bez(k,t0),b=bez(k,t1),tg=tan(k,t0),nx=-tg[1]*9,ny=tg[0]*9;
      wc.fillStyle=i%2?"rgba(240,240,236,.55)":"rgba(227,50,43,.7)";wc.beginPath();wc.moveTo(a[0]-nx,a[1]-ny);wc.lineTo(b[0]-nx,b[1]-ny);wc.lineTo(b[0]+nx,b[1]+ny);wc.lineTo(a[0]+nx,a[1]+ny);wc.closePath();wc.fill()}
    // grid lines like a timing overlay
    wc.strokeStyle="rgba(150,165,190,.05)";wc.lineWidth=1;for(let x=0;x<W;x+=48){wc.beginPath();wc.moveTo(x,0);wc.lineTo(x,H);wc.stroke()}
    // vignette
    const v=wc.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.2,W*.5,H*.5,Math.max(W,H)*.8);v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,.75)");wc.fillStyle=v;wc.fillRect(0,0,W,H);
  }
  const trails=[{c:1,col:"227,50,43",w:3,sp:.9,dash:[140,520]},{c:3,col:"255,178,30",w:2,sp:.6,dash:[90,640]},{c:0,col:"235,240,255",w:2,sp:1.2,dash:[200,800]},{c:4,col:"180,108,255",w:1.6,sp:.45,dash:[60,700]},{c:2,col:"227,50,43",w:2.4,sp:1,dash:[120,900]}];
  let off=0,last=0;
  function frame(ts){
    if(ts-last>33||reduce){last=ts;off+=6;fc.clearRect(0,0,W,H);fc.lineCap="round";
      trails.forEach((t,i)=>{const c=curves[t.c];fc.setLineDash(t.dash);fc.lineDashOffset=-(off*t.sp+i*300);fc.strokeStyle=`rgba(${t.col},.8)`;fc.lineWidth=t.w;fc.shadowColor=`rgba(${t.col},.9)`;fc.shadowBlur=14;fc.beginPath();fc.moveTo(c[0],c[1]);fc.bezierCurveTo(c[2],c[3],c[4],c[5],c[6],c[7]);fc.stroke()});
      fc.setLineDash([]);fc.shadowBlur=0}
    if(!reduce)requestAnimationFrame(frame)}
  addEventListener("resize",()=>{size();if(reduce)frame(0)});size();requestAnimationFrame(frame);
})();
</script>
